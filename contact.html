<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="WebStyleCSS/WebStyle.css">
</head>

<body>

    <header>
        <h1>Contact</h1>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-contact">

        <!-- Konten Utama Halaman Kontak -->
        <h2>Call Me 🤙</h2>

        <!-- Bagian Informasi Kontak & Media Sosial -->
        <div class="kontak-info">
            <p>📧 Email: <a href="mailto:zayyandziaulhaq@gmail.com">zayyandziaulhaq@gmail.com</a></p>
            <p>📞 Phone: +62 823-1810-0024</p>

            <!-- Tautan Media Sosial Instagram (Menggunakan # sesuai instruksi) -->
            <p>📸 Instagram: <a href="#" class="medsos-link">@d.zaayn</a></p>
        </div>

        <!-- Formulir Kontak Sederhana -->
        <form class="kontak-form">
            <div class="form-group">
                <label for="nama">Name</label>
                <input type="text" id="nama" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="pesan">Message</label>
                <textarea id="pesan" rows="4" placeholder="Enter your message here..." required></textarea>
            </div>
            
            <!-- Tombol Kirim -->
            <button type="submit" class="btn-kirim">Send</button>
        </form>

    </main>

    <footer>
        <p>&copy; 2026 My Portfolio</p>
    </footer>

</body>
</html>
